# Environment-specific settings (database, embeddings, classifier) live in
# .env/codebrain.toml which is git-ignored. Copy codebrain.example.toml to
# .env/codebrain.toml and edit it for your local setup.

[ingestion]
chunk_size = 512
overlap = 64
workers = 4
# Per-file cap for non-code content (markdown/toml/yaml) to avoid indexing
# oversized generated or vendored docs/config blobs.
non_code_max_bytes = 262144
exclude = [
    "node_modules", ".git", "dist", "build", "__pycache__",
    ".venv", "venv", ".env", ".claude", "*.lock", "*.min.js", "*.min.css",
    "*.map", "package-lock.json", "yarn.lock", ".next", ".nuxt",
    "coverage", ".pytest_cache", ".mypy_cache", "target"
]

[languages]
supported = [
    "python", "typescript", "javascript", "tsx", "jsx",
    "rust", "go", "java", "c", "cpp", "ruby", "php",
    "swift", "kotlin", "scala", "zig", "elixir", "csharp",
    "markdown", "toml", "yaml", "html", "css"
]

# File extension → language mapping (tree-sitter grammar names)
[languages.extensions]
py = "python"
ts = "typescript"
tsx = "tsx"
js = "javascript"
jsx = "javascript"
rs = "rust"
go = "go"
java = "java"
c = "c"
h = "c"
cpp = "cpp"
hpp = "cpp"
cc = "cpp"
rb = "ruby"
php = "php"
swift = "swift"
kt = "kotlin"
scala = "scala"
zig = "zig"
ex = "elixir"
exs = "elixir"
cs = "csharp"
md = "markdown"
toml = "toml"
yml = "yaml"
yaml = "yaml"
html = "html"
css = "css"
