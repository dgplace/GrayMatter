name: codebrain

services:
  embed_proxy:
    image: alpine/socat
    command:
      - -d
      - -d
      - TCP-LISTEN:11434,fork,reuseaddr
      - TCP:${EMBED_PROXY_TARGET:-host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codebrain_internal
      - codebrain_host_access

  classifier_proxy:
    image: alpine/socat
    command:
      - -d
      - -d
      - TCP-LISTEN:3000,fork,reuseaddr
      - TCP:${CLASSIFIER_PROXY_TARGET:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codebrain_internal
      - codebrain_host_access

  postgres_frontdoor:
    image: alpine/socat
    command:
      - -d
      - -d
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:postgres:5432
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "${POSTGRES_FRONTDOOR_BIND:-0.0.0.0}:${POSTGRES_FRONTDOOR_PORT:-5432}:5432"
    networks:
      - codebrain_internal
      - codebrain_host_access

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codebrain
      POSTGRES_USER: codebrain
      POSTGRES_PASSWORD: codebrain_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebrain -d codebrain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codebrain_internal

  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    image: codebrain-indexer:latest
    depends_on:
      postgres:
        condition: service_healthy
      embed_proxy:
        condition: service_started
      classifier_proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://codebrain:codebrain_local@postgres:5432/codebrain
      # Endpoint resolver scripts enforce local-only host model policy and emit
      # proxy service URLs for container-safe access.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://embed_proxy:11434}
      CLASSIFIER_BASE_URL: ${CLASSIFIER_BASE_URL:-http://classifier_proxy:3000}
    working_dir: /workspace
    volumes:
      - ..:/workspace
    profiles:
      - indexer
    networks:
      - codebrain_internal
      - codebrain_host_access

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    env_file:
      - path: ../.env/mcp.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      embed_proxy:
        condition: service_started
      classifier_proxy:
        condition: service_started
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3001"
      CODEBRAIN_REPO_ROOT: /workspace
      DATABASE_URL: postgresql://codebrain:codebrain_local@postgres:5432/codebrain
      EMBED_API_STYLE: ollama
      EMBED_BASE_URL: http://embed_proxy:11434
      EMBED_MODEL: nomic-embed-text
      EMBED_DIMENSIONS: "768"
    init: true
    restart: unless-stopped
    volumes:
      - ..:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - tools
    networks:
      - codebrain_internal

  mcp_frontdoor:
    image: alpine/socat
    command:
      - -d
      - -d
      - TCP-LISTEN:3001,fork,reuseaddr
      - TCP:mcp:3001
    depends_on:
      mcp:
        condition: service_started
    ports:
      - "0.0.0.0:3001:3001"
    profiles:
      - tools
    networks:
      - codebrain_internal
      - codebrain_host_access

volumes:
  postgres_data:

networks:
  codebrain_internal:
    driver: bridge
    internal: true
  codebrain_host_access:
    driver: bridge
