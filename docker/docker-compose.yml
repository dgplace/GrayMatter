name: codebrain

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codebrain
      POSTGRES_USER: codebrain
      POSTGRES_PASSWORD: codebrain_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebrain -d codebrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    image: codebrain-indexer:latest
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://codebrain:codebrain_local@postgres:5432/codebrain
      # EMBED_BASE_URL and CLASSIFIER_BASE_URL are passed through from the host
      # by scripts/index-repo.{sh,bat} (and watch-repo.{sh,bat}), which translates
      # 127.0.0.1/localhost in the toml to host.docker.internal so the container
      # can reach the host's services. Anything else (LAN IP, resolvable host)
      # is passed through unchanged. If env vars are not set, the toml value
      # in .env/codebrain.toml is used directly.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      CLASSIFIER_BASE_URL: ${CLASSIFIER_BASE_URL:-}
    working_dir: /workspace
    volumes:
      - ..:/workspace
    profiles:
      - indexer

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3001"
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],host.docker.internal
      DATABASE_URL: postgresql://codebrain:codebrain_local@postgres:5432/codebrain
      EMBED_API_STYLE: ollama
      EMBED_BASE_URL: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
      EMBED_DIMENSIONS: "768"
    init: true
    ports:
      - "3001:3001"
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
